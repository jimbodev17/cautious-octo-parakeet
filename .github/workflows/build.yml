name: Build Jimbo's Roulette

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          apt-get update
          apt-get install -y unzip
          unzip -o jimbosroulette.zip

      - name: Install 3DS libraries
        run: dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Build
        run: make
        working-directory: jimbosroulette

      - name: Save the result
        uses: actions/upload-artifact@v4
        with:
          name: jimbosroulette-3dsx
          path: jimbosroulette/jimbosroulette.3dsx
